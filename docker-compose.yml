services:
  app:
    image: alpine:3.20
    working_dir: /app
    volumes:
      - .:/app
    command: sh -c "echo 'RoboWare container is ready.' && tail -f /dev/null"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    command: npm run dev -- --host 0.0.0.0
