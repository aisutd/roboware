<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>RoboWare UI mockups</title>
<!-- Static mockups for docs/ui-ideas.md. Open with ?m=<name>; render.ps1 screenshots each one. -->
<link rel="stylesheet" href="../../frontend/src/index.css" />
<style>
  .shell { display: flex; width: 100vw; height: 100vh; }
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; padding: 12px 12px 12px 14px; gap: 10px; }
  .row { display: flex; gap: 10px; }
  .col { display: flex; flex-direction: column; gap: 10px; }
  .grow { flex: 1; min-width: 0; min-height: 0; }
  .muted { color: var(--text-tertiary); }
  .sec { font-size: 10px; font-weight: 800; letter-spacing: 0.06em; color: var(--text-secondary); text-transform: uppercase; }
  .stage { position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; border-radius: 1.5rem;
    background-color: #F4F1EA; background-image: radial-gradient(#E2DDD3 1px, transparent 1px); background-size: 28px 28px; }
  .map-board { padding: 18px; border-radius: 1.4rem; }
  .lbl { font-family: var(--font-mono); font-size: 10px; font-weight: 700; color: var(--text-tertiary); display: flex; align-items: center; justify-content: center; }
  .seg { display: inline-flex; gap: 3px; background: #EAE5DC; padding: 3px; border-radius: 9999px; }
  .seg span { padding: 3px 10px; border-radius: 9999px; font-size: 11px; font-weight: 700; color: #6B6357; }
  .seg span.on { background: #FAF8F5; color: #23201A; box-shadow: 2px 2px 5px rgba(35,32,26,.1); }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .bar { height: 5px; border-radius: 9999px; background: #E2DDD3; overflow: hidden; }
  .bar > div { height: 100%; }
  .kbd { font-family: var(--font-mono); font-size: 11px; font-weight: 800; padding: 2px 7px; border-radius: 6px; background: #FAF8F5;
    box-shadow: 0 2px 0 #D8D0BF, inset 1px 1px 2px #fff; border: 1px solid #E2DDD3; }
  /* Annotation tags: purple so they read as notes, not UI. */
  .tag { position: absolute; z-index: 400; background: #7C3AED; color: #fff; font: 800 11px var(--font-mono); padding: 3px 8px; border-radius: 8px;
    box-shadow: 0 4px 10px rgba(124,58,237,.35); white-space: nowrap; }
  .ring { position: absolute; z-index: 399; border: 2px dashed #7C3AED; border-radius: 1.6rem; pointer-events: none; }
  .title-strip { position: absolute; z-index: 401; top: 0; left: 0; right: 0; background: #23201A; color: #F4F1EA; font: 700 12px var(--font-ui);
    padding: 6px 14px; letter-spacing: .02em; }
  .title-strip b { color: #C4B5FD; margin-right: 8px; font-family: var(--font-mono); }
  body.has-strip .shell, body.has-strip > .page { padding-top: 28px; }
  .page { width: 100vw; height: 100vh; position: relative; }
  .clay-btn { white-space: nowrap; }
  .soft { color: var(--text-secondary); }
  .qbest { background: #FFE7DF; border: 1.5px solid #FF5A26; }
  .dark .qbest { background: rgba(255,90,38,.25); }

  /* Dark "night shift" theme for E1 */
  .dark { --text-primary: #F1ECE3; --text-secondary: #B8AE9F; --text-tertiary: #8A8172; color: #F1ECE3; background: #1A1814; }
  .dark .clay-card, .dark .clay-card-flat { background: #26231E; border-color: rgba(255,255,255,.05);
    box-shadow: 10px 14px 28px rgba(0,0,0,.45), inset 2px 2px 4px rgba(255,255,255,.05), inset -2px -3px 6px rgba(0,0,0,.4); }
  .dark .clay-card-flat { background: #2D2A24; }
  .dark .clay-btn { background: #2D2A24; color: #F1ECE3; border-color: rgba(255,255,255,.06); box-shadow: 3px 4px 10px rgba(0,0,0,.4), inset 1px 1px 2px rgba(255,255,255,.06); }
  .dark .clay-btn-accent { background: #FF5A26; color: #fff; }
  .dark .stage { background-color: #1A1814; background-image: radial-gradient(#2E2A23 1px, transparent 1px); }
  .dark .map-board { background: #211E19; border-color: rgba(255,255,255,.05); box-shadow: 16px 24px 50px rgba(0,0,0,.5), inset 2px 2px 4px rgba(255,255,255,.04); }
  .dark .tile-aisle { background: #2B2822; border-color: #34302A; box-shadow: inset 1px 1px 3px rgba(0,0,0,.4); }
  .dark .tile-rack { background: linear-gradient(145deg, #4A443A, #3D382F); border-color: rgba(255,255,255,.06); }
  .dark .robot-body { background: #3A362E; }
  .dark .seg { background: #1F1C18; } .dark .seg span.on { background: #34302A; color: #F1ECE3; }
  .dark .badge { background: #34302A; color: #CFC6B8; } .dark .bar { background: #3A362E; }
  .dark .nav-item.active { background: #34302A; color: #F1ECE3; } .dark .nav-item { color: #9E9587; }
</style>
</head>
<body>
<div id="root"></div>
<script>
// ---------- data: the real default layout ----------
const GRID = [
  '................',
  '....RR.RR.RR....',
  'C...RR.RR.RR..P.',
  '....RR.RR.RR....',
  '................',
  '....RR.RR.RR..P.',
  '....RR.RR.RR....',
  'C...RR.RR.RR....',
  '..............D.',
  '................',
];
const W = 16, H = 10;
const KIND = { '.': 'aisle', R: 'rack', P: 'packing', D: 'dock', C: 'charger' };
const kind = (x, y) => KIND[GRID[y]?.[x]];
const COLORS = ['#E84F1D', '#2563EB', '#059669', '#9333EA', '#E11D48', '#0891B2'];
const colLabel = (x) => String.fromCharCode(65 + x);
const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];
const isFace = (x, y) => kind(x, y) === 'aisle' && DIRS.some(([dx, dy]) => kind(x + dx, y + dy) === 'rack');
const passable = (x, y) => x >= 0 && y >= 0 && x < W && y < H && kind(x, y) !== 'rack';

function bfs(tx, ty) {
  const d = Array.from({ length: H }, () => Array(W).fill(Infinity));
  d[ty][tx] = 0;
  const q = [[tx, ty]];
  while (q.length) {
    const [x, y] = q.shift();
    for (const [dx, dy] of DIRS) {
      const nx = x + dx, ny = y + dy;
      if (passable(nx, ny) && d[ny][nx] === Infinity) { d[ny][nx] = d[y][x] + 1; q.push([nx, ny]); }
    }
  }
  return d;
}
function shortest(a, b) {
  const d = bfs(b[0], b[1]);
  const out = [a];
  let [x, y] = a;
  while (d[y][x] > 0) {
    const [dx, dy] = DIRS.find(([dx, dy]) => d[y + dy]?.[x + dx] === d[y][x] - 1);
    x += dx; y += dy; out.push([x, y]);
  }
  return out;
}
function wander(a, b, steps, seed) {
  let s = seed;
  const rnd = () => ((s = (s * 9301 + 49297) % 233280) / 233280);
  const out = [a];
  let [x, y] = a;
  for (let i = 0; i < steps; i++) {
    const opts = DIRS.filter(([dx, dy]) => passable(x + dx, y + dy));
    const [dx, dy] = opts[Math.floor(rnd() * opts.length)];
    x += dx; y += dy; out.push([x, y]);
    if (x === b[0] && y === b[1]) break;
  }
  return out.concat(shortest([x, y], b).slice(1));
}

// ---------- building blocks ----------
const tag = (text, style) => `<div class="tag" style="${style}">${text}</div>`;
const ring = (style) => `<div class="ring" style="${style}"></div>`;

function nav(active = 'session') {
  const items = [['session', 'Session', '▶'], ['models', 'Models', '◎'], ['layouts', 'Layouts', '▦'], ['history', 'History', '↺']];
  return `<nav class="nav-rail clay-card" style="margin:12px 0 12px 12px">
    <div class="nav-brand">RW</div>
    ${items.map(([id, label, icon]) => `<div class="nav-item ${id === active ? 'active' : ''}"><span style="font-size:16px">${icon}</span><span>${label}</span></div>`).join('')}
  </nav>`;
}

function robot({ id, x, y, color, battery = 80, heading = 0, carry, cell, gap, selected, yielding }) {
  const step = cell + gap, size = Math.round(cell * 0.78);
  const c = 2 * Math.PI * 21;
  const batt = battery > 50 ? '#10B981' : battery > 20 ? '#F59E0B' : '#EF4444';
  return `<div class="robot-puck ${selected ? 'selected' : ''}" style="left:${x * step + (cell - size) / 2}px;top:${y * step + (cell - size) / 2}px;width:${size}px;height:${size}px;z-index:20">
    ${yielding ? '<div class="yield-ring" style="animation:none;opacity:.7;transform:scale(1.3)"></div>' : ''}
    <svg class="battery-ring" viewBox="0 0 48 48"><circle cx="24" cy="24" r="21" fill="none" stroke="#E6E1D6" stroke-width="3"/>
      <circle cx="24" cy="24" r="21" fill="none" stroke="${batt}" stroke-width="3" stroke-dasharray="${c * battery / 100} ${c}" stroke-linecap="round"/></svg>
    <div class="robot-body" style="width:${size - 9}px;height:${size - 9}px">
      <div class="robot-nose-wrap" style="transform:rotate(${heading}deg)"><div class="robot-nose" style="border-left-color:${color}"></div></div>
      <span class="robot-label" style="color:${color};font-size:${cell < 40 ? 9 : 11}px">${id}</span>
    </div>
    ${carry ? `<div class="carry-badge">${carry}</div>` : ''}
  </div>`;
}

function polyline(points, { cell, gap, color, width = 2.5, dash = '6 6', opacity = 1 }) {
  const step = cell + gap;
  const pts = points.map(([x, y]) => `${x * step + cell / 2},${y * step + cell / 2}`).join(' ');
  return `<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="${width}" stroke-dasharray="${dash}" stroke-linecap="round" stroke-linejoin="round" opacity="${opacity}"/>`;
}

// Renders the warehouse board. opts: cell, gap, robots, paths, heat {target}, trails, errors, ghosts, painted, queues.
function board(opts = {}) {
  const cell = opts.cell ?? 44, gap = opts.gap ?? 5, step = cell + gap;
  const heatD = opts.heat ? bfs(...opts.heat) : null;
  const maxD = heatD ? Math.max(...heatD.flat().filter(Number.isFinite)) : 1;
  const errors = new Set((opts.errors ?? []).map(String));
  const painted = new Set((opts.painted ?? []).map(String));
  const tiles = [];
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    let k = kind(x, y);
    if (painted.has(String([x, y]))) k = 'rack';
    const cls = { aisle: 'tile-aisle', rack: 'tile-rack', packing: 'tile-packing', dock: 'tile-delivery', charger: 'tile-charging' }[k];
    let inner = '';
    if (k === 'rack') inner = '<div class="rack-inset"></div>';
    if (k === 'packing') inner = '<span class="tile-caption">PACK</span>';
    if (k === 'dock') inner = '<span class="tile-caption">DOCK</span>';
    if (k === 'charger') inner = '<span style="font-size:16px;color:#fff">⚡</span>';
    if (k === 'aisle' && isFace(x, y) && !heatD && !opts.plain) inner = '<div class="face-dot"></div>';
    if (heatD && Number.isFinite(heatD[y][x]) && k !== 'rack') {
      const v = 1 - heatD[y][x] / maxD;
      const nxt = DIRS.find(([dx, dy]) => passable(x + dx, y + dy) && heatD[y + dy][x + dx] === heatD[y][x] - 1);
      const arrow = nxt ? { '1,0': '→', '-1,0': '←', '0,1': '↓', '0,-1': '↑' }[nxt.join()] : '';
      inner += `<div style="position:absolute;inset:0;border-radius:inherit;background:rgba(255,90,38,${(0.08 + v * 0.75).toFixed(2)})"></div>
        <span style="position:relative;font:800 ${cell > 40 ? 13 : 10}px var(--font-mono);color:rgba(35,32,26,.7)">${arrow}</span>`;
      if (x === opts.heat[0] && y === opts.heat[1]) inner += '<div class="heat-target"></div>';
    }
    const err = errors.has(String([x, y])) ? 'outline:3px solid #EF4444;outline-offset:-3px;' : '';
    const pnt = painted.has(String([x, y])) ? 'outline:2px dashed #7C3AED;outline-offset:1px;' : '';
    tiles.push(`<div class="tile-base ${cls}" style="width:${cell}px;height:${cell}px;display:flex;align-items:center;justify-content:center;position:relative;${err}${pnt}">${inner}</div>`);
  }
  const svg = [];
  (opts.ghosts ?? []).forEach((g) => svg.push(polyline(g.points, { cell, gap, color: g.color, width: g.width ?? 3, dash: g.dash ?? '0', opacity: g.opacity ?? 1 })));
  (opts.trails ?? []).forEach((t) => {
    const n = t.points.length;
    t.points.forEach((p, i) => { if (i) svg.push(polyline([t.points[i - 1], p], { cell, gap, color: t.color, width: 5, dash: '0', opacity: ((i / n) * 0.55).toFixed(2) })); });
  });
  (opts.paths ?? []).forEach((p) => svg.push(polyline(p.points, { cell, gap, color: p.color })));
  const queues = (opts.queues ?? []).map(([x, y, n]) => `<div style="position:absolute;left:${x * step + cell - 12}px;top:${y * step - 8}px;z-index:30;background:#23201A;color:#fff;font:800 10px var(--font-mono);padding:2px 6px;border-radius:9999px">${n} waiting</div>`).join('');
  const gw = W * step - gap, gh = H * step - gap;
  return `<div class="map-board" ${opts.boardStyle ? `style="${opts.boardStyle}"` : ''}>
    <div style="display:grid;grid-template-columns:18px ${gw}px;gap:6px">
      <div></div>
      <div style="display:grid;grid-template-columns:repeat(${W},${cell}px);gap:${gap}px">${Array.from({ length: W }, (_, x) => `<div class="lbl">${colLabel(x)}</div>`).join('')}</div>
      <div style="display:grid;grid-template-rows:repeat(${H},${cell}px);gap:${gap}px">${Array.from({ length: H }, (_, y) => `<div class="lbl">${y + 1}</div>`).join('')}</div>
      <div style="position:relative;width:${gw}px;height:${gh}px">
        <div style="display:grid;grid-template-columns:repeat(${W},${cell}px);gap:${gap}px">${tiles.join('')}</div>
        <svg width="${gw}" height="${gh}" style="position:absolute;inset:0;overflow:visible;pointer-events:none;z-index:10">${svg.join('')}</svg>
        ${(opts.robots ?? []).map((r) => robot({ ...r, cell, gap })).join('')}
        ${queues}
        ${opts.extra ?? ''}
      </div>
    </div>
  </div>`;
}

function spark(values, color, w = 150, h = 34, fill = true) {
  const max = Math.max(...values), min = Math.min(...values);
  const pts = values.map((v, i) => [(i / (values.length - 1)) * w, h - 3 - ((v - min) / (max - min || 1)) * (h - 6)]);
  const d = pts.map(([x, y], i) => `${i ? 'L' : 'M'}${x.toFixed(1)},${y.toFixed(1)}`).join('');
  return `<svg width="${w}" height="${h}">${fill ? `<path d="${d}L${w},${h}L0,${h}Z" fill="${color}" opacity=".12"/>` : ''}<path d="${d}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round"/></svg>`;
}
const series = (n, f) => Array.from({ length: n }, (_, i) => f(i));
const noise = (i, k = 1) => Math.sin(i * 1.7) * 0.5 * k + Math.sin(i * 0.43 + 1) * 0.8 * k;

function chart(seriesList, { w = 520, h = 190, xLabel = 'episode', yLabel = '' } = {}) {
  const all = seriesList.flatMap((s) => s.values);
  const max = Math.max(...all), min = Math.min(...all);
  const px = (i, n) => 40 + (i / (n - 1)) * (w - 56);
  const py = (v) => 12 + (1 - (v - min) / (max - min || 1)) * (h - 40);
  const grid = [0, 0.25, 0.5, 0.75, 1].map((t) => {
    const v = min + (max - min) * t;
    return `<line x1="40" x2="${w - 16}" y1="${py(v)}" y2="${py(v)}" stroke="#E6E1D6"/><text x="34" y="${py(v) + 3}" text-anchor="end" font-size="9" fill="#9E9587" font-family="JetBrains Mono">${Math.round(v)}</text>`;
  }).join('');
  const lines = seriesList.map((s) => `<path d="${s.values.map((v, i) => `${i ? 'L' : 'M'}${px(i, s.values.length).toFixed(1)},${py(v).toFixed(1)}`).join('')}" fill="none" stroke="${s.color}" stroke-width="2.2" stroke-dasharray="${s.dash ?? '0'}"/>`).join('');
  return `<svg width="${w}" height="${h}">${grid}${lines}<text x="${w - 16}" y="${h - 6}" text-anchor="end" font-size="10" fill="#9E9587">${xLabel} →</text><text x="40" y="${h - 6}" font-size="10" fill="#9E9587">${yLabel}</text></svg>`;
}

const ROBOTS = [
  { id: 'R1', x: 6, y: 4, color: COLORS[0], battery: 72, heading: 0, carry: 2, selected: true },
  { id: 'R2', x: 3, y: 2, color: COLORS[1], battery: 55, heading: 90 },
  { id: 'R3', x: 0, y: 7, color: COLORS[2], battery: 18, heading: 180 },
  { id: 'R4', x: 10, y: 8, color: COLORS[3], battery: 91, heading: 0, carry: 1, yielding: true },
];
const PATHS = [
  { color: COLORS[0], points: shortest([6, 4], [14, 5]) },
  { color: COLORS[1], points: shortest([3, 2], [6, 3]) },
  { color: COLORS[3], points: shortest([10, 8], [14, 8]) },
];

function kpis(dark) {
  const k = [['Delivered', '14', '#10B981'], ['Per 100 ticks', '2.31', '#FF5A26'], ['Avg cycle', '26', '#2563EB'], ['Waits', '3', '#F59E0B'], ['Fallbacks', '1', '#9333EA'], ['Failed', '0', '#EF4444']];
  return `<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">${k.map(([l, v, c]) => `<div class="clay-card-flat stat"><span class="stat-label">${l}</span><span class="stat-value" style="color:${c};font-size:15px">${v}</span></div>`).join('')}</div>`;
}

const ROSTER = [
  { id: 'R1', status: 'Going to packing', order: 'ORD-0007', battery: 72, color: COLORS[0] },
  { id: 'R2', status: 'Picking · Desk Lamp', order: 'ORD-0009', battery: 55, color: COLORS[1] },
  { id: 'R3', status: 'Charging', order: '—', battery: 18, color: COLORS[2] },
  { id: 'R4', status: 'Waiting for R1 (yield)', order: 'ORD-0006', battery: 91, color: COLORS[3] },
];
function roster(expandFirst = true) {
  return ROSTER.map((r, i) => {
    const b = r.battery > 50 ? '#10B981' : r.battery > 20 ? '#F59E0B' : '#EF4444';
    const sel = i === 0 && expandFirst;
    return `<div class="clay-card-flat" style="padding:8px 10px;${sel ? 'outline:2px solid #23201A;outline-offset:-2px' : ''}">
      <div style="display:flex;align-items:center;gap:8px">
        <span class="dot" style="background:${r.color};width:10px;height:10px"></span>
        <span class="font-mono" style="font-weight:800;font-size:12px;color:${r.color}">${r.id}</span>
        <span style="font-size:11px;font-weight:600;flex:1">${r.status}</span>
        <span class="font-mono muted" style="font-size:10px">${r.order}</span>
      </div>
      <div style="display:flex;align-items:center;gap:6px;margin-top:5px">
        <div class="bar" style="flex:1"><div style="width:${r.battery}%;background:${b}"></div></div>
        <span class="font-mono" style="font-size:10px;font-weight:700;width:30px;text-align:right">${r.battery}%</span>
      </div>
      ${sel ? `<div style="display:flex;gap:10px;margin-top:8px;align-items:center">
        <div style="display:grid;grid-template-columns:repeat(3,34px);grid-template-rows:repeat(3,22px);gap:3px;font:800 9px var(--font-mono)">
          <div></div><div class="clay-card-flat" style="display:flex;align-items:center;justify-content:center;border-radius:6px">↑-4.1</div><div></div>
          <div class="clay-card-flat" style="display:flex;align-items:center;justify-content:center;border-radius:6px">←-5.0</div><div style="display:flex;align-items:center;justify-content:center;color:${r.color}">R1</div><div class="qbest" style="display:flex;align-items:center;justify-content:center;border-radius:6px">→-1.2</div>
          <div></div><div class="clay-card-flat" style="display:flex;align-items:center;justify-content:center;border-radius:6px">↓-3.8</div><div></div>
        </div>
        <div class="soft" style="font-size:10px;line-height:1.5">At <b class="font-mono">G5</b> → <b class="font-mono">O6</b><br>Carrying 2× Mouse Pad<br>Route: Q-policy (no fallback)</div>
      </div>` : ''}
    </div>`;
  }).join('');
}

const ORDERS = [
  ['ORD-0009', 'R2', 'PICKING', '#FF5A26', '1× Desk Lamp, 2× USB-C Cable', 1, false],
  ['ORD-0008', '', 'QUEUED', '#B8B0A2', '1× Webcam', 0, true],
  ['ORD-0007', 'R1', 'PACKING', '#2563EB', '2× Mouse Pad', 2, false],
  ['ORD-0006', 'R4', 'SHIPPING', '#10B981', '1× Monitor Stand', 3, false],
];
function orderList(n = 4) {
  const stageC = ['#FF5A26', '#2563EB', '#10B981', '#8E8578'];
  return ORDERS.slice(0, n).map(([id, r, st, c, items, reached, rush]) => `<div class="clay-card-flat" style="padding:7px 10px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:3px">
      <span class="font-mono" style="font-size:11px;font-weight:800">${id} ${rush ? '<span class="badge badge-rush">RUSH</span>' : ''} ${r ? `<span class="badge">${r}</span>` : ''}</span>
      <span style="font-size:9px;font-weight:800;color:${c}">${st}</span></div>
    <div class="soft" style="font-size:11px;margin-bottom:5px">${items}</div>
    <div style="display:flex;gap:4px">${stageC.map((sc, i) => `<span style="flex:1;height:4px;border-radius:9999px;background:${i <= reached && st !== 'QUEUED' ? sc : '#E2DDD3'}"></span>`).join('')}</div>
  </div>`).join('');
}

function topBar({ withSpark = true } = {}) {

  { name: 'Hybrid', sub: 'Warehouse pro v4', color: '#FF5A26', tp: 2.31, p95: 42, fb: '2%', extra: 0.1, waits: 5, failed: 0, win: true },
];
M.compare = () => `<div class="shell">${nav('history')}
  <div class="main">
    <div class="clay-card" style="padding:12px 18px;display:flex;align-items:center;gap:14px;position:relative">
      <div><b style="font-size:18px">Compare</b><div style="font-size:11px;color:#8E8578">Same 2,000 ticks · seed 42 · 4 robots · 20 orders / 100 ticks · warehouse-v3</div></div>
      <div style="flex:1"></div><span class="clay-btn clay-pill-sm">Edit runs</span><span class="clay-btn clay-pill-sm">⤓ Export PNG</span><span class="clay-btn clay-pill-sm">⤓ Markdown</span></div>
    <div class="row">
      ${RUNS.map((r) => `<div class="clay-card grow" style="padding:16px 18px;position:relative;${r.win ? 'outline:2.5px solid #FF5A26;outline-offset:-2px' : ''}">
        ${r.win ? '<span class="badge badge-rush" style="position:absolute;top:14px;right:14px">★ WINNER</span>' : ''}
        <div style="display:flex;align-items:center;gap:8px"><span class="dot" style="background:${r.color};width:12px;height:12px"></span><b style="font-size:15px">${r.name}</b></div>
        <div style="font-size:11px;color:#8E8578">${r.sub}</div>
        <div style="display:flex;align-items:baseline;gap:8px;margin-top:10px"><span class="font-mono" style="font-size:38px;font-weight:800;color:${r.color}">${r.tp.toFixed(2)}</span><span style="font-size:11px;color:#6B6357">orders / 100 ticks</span></div>
        ${r.name !== 'Pure A*' ? `<span class="badge badge-live" style="font-size:11px">+${Math.round((r.tp / 1.68 - 1) * 100)}% vs A*</span>` : '<span class="badge" style="font-size:11px">baseline</span>'}
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px">
          ${[['p95 time', r.p95], ['waits', r.waits], ['fallbacks', r.fb]].map(([l, v]) => `<div class="clay-card-flat stat"><span class="stat-label">${l}</span><span class="stat-value" style="font-size:14px">${v}</span></div>`).join('')}</div>
      </div>`).join('')}
    </div>
    <div class="row grow">
      <div class="clay-card grow" style="padding:14px 18px">
        <span class="sec">Metric by metric</span>
        <table class="data-table" style="margin-top:8px"><thead><tr><th>Metric</th>${RUNS.map((r) => `<th class="num" style="color:${r.color}">${r.name}</th>`).join('')}</tr></thead><tbody>
          ${[['Orders per 100 ticks', 'tp', 'high'], ['p95 order time (ticks)', 'p95', 'low'], ['Collision waits', 'waits', 'low'], ['Extra steps per leg vs A*', 'extra', 'low'], ['Failed orders', 'failed', 'low']].map(([l, k, better]) => {
            const vals = RUNS.map((r) => r[k]);
            const best = better === 'high' ? Math.max(...vals) : Math.min(...vals);
            return `<tr><td>${l} <span class="muted" style="font-size:10px">${better === 'high' ? '↑ better' : '↓ better'}</span></td>${vals.map((v) => `<td class="num" style="${v === best && vals.filter((x) => x === best).length === 1 ? 'background:#E7F8F0;font-weight:800;color:#047857' : ''}">${v}</td>`).join('')}</tr>`;
          }).join('')}
        </tbody></table>
      </div>
      <div class="clay-card grow" style="padding:14px 18px">
        <span class="sec">Deliveries over time</span>
        <div style="display:flex;gap:14px;font-size:11px;margin:6px 0">${RUNS.map((r) => `<span><span class="dot" style="background:${r.color}"></span> ${r.name}</span>`).join('')}</div>
        ${chart(RUNS.map((r) => ({ values: series(40, (i) => i * r.tp * 0.5 + noise(i, 0.6)), color: r.color })), { w: 520, h: 220, xLabel: 'tick', yLabel: 'delivered' })}
      </div>
    </div>
  </div>
  ${tag('D1 · head-to-head cards, winner + delta vs A*', 'top:74px;left:420px')}
  ${tag('D3 · export', 'top:8px;right:120px')}
  ${tag('best value per metric highlighted', 'top:324px;left:250px')}
</div>`;

M.replay = () => `<div class="shell">${nav('history')}
  <div class="main">
    <div class="clay-card" style="padding:12px 18px;display:flex;align-items:center;gap:14px">

        <div class="seg"><span>1x</span><span class="on">5x</span><span>20x</span></div></div>
      <div style="position:relative;height:30px">

        ${series(41, (i) => (i * 2.37 + Math.sin(i) * 1.2 + 2).toFixed(1)).map((p) => `<div style="position:absolute;left:${p}%;top:0;width:2px;height:9px;background:#10B981"></div>`).join('')}
        ${[8, 13.5, 30, 31, 52, 67, 80].map((p) => `<div style="position:absolute;left:${p}%;top:21px;width:2px;height:9px;background:#F59E0B"></div>`).join('')}
        <div style="position:absolute;left:calc(40.6% - 9px);top:6px;width:18px;height:18px;border-radius:50%;background:#FAF8F5;box-shadow:2px 3px 6px rgba(35,32,26,.25)"></div>
      </div>

  ${tag('D2 · scrub a finished session; event markers on the timeline', 'bottom:96px;left:420px')}
</div>`;

M.dark = () => `<div class="dark" style="width:100vw;height:100vh">${sessionScreen({ tags: false })}${tag('E1 · night-shift dark mode', 'top:8px;left:110px')}</div>`;

M.firstrun = () => `<div class="shell">${nav('session')}
  <div class="main" style="align-items:center;justify-content:center">
    <div style="text-align:center;max-width:760px">
      <div class="nav-brand" style="width:64px;height:64px;font-size:20px;margin:0 auto 14px">RW</div>
      <h1 style="font-size:30px;font-weight:800;letter-spacing:-.02em">Teach a robot fleet to run a warehouse</h1>
      <p style="font-size:14px;color:#6B6357;margin-top:8px">Three steps, about two minutes. You can skip any of them.</p>
    </div>
    <div class="row" style="gap:18px;margin-top:26px">
      ${[['1', 'Train a model', 'Robots learn a route to every shelf, packing station and dock with Q-learning.', 'Done · Warehouse pro', true, 'Models'],
         ['2', 'Run a session', 'Send 4 robots onto the floor with live orders and watch them pick, pack and ship.', 'Start session', false, 'Session'],
         ['3', 'Prove it works', 'Replay the same orders with plain A* and see how much training helps.', 'Compare', false, 'History']].map(([n, t, d, cta, done, where], i) => `
        <div class="clay-card" style="width:270px;padding:22px;display:flex;flex-direction:column;gap:10px;${i === 1 ? 'outline:2.5px solid #FF5A26;outline-offset:-2px' : ''}">

document.getElementById('root').innerHTML = (M[name] ?? M.session)();
